<!doctype html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<title>读一场录音</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/ds4seasdesignsystem_af6e46/colors_and_type.css">
<link rel="stylesheet" href="./zt.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Oxanium:wght@500;600;700&family=LXGW+WenKai+TC:wght@400;700&display=swap">
<style>
body{margin:0}
a{color:inherit}a:hover{color:inherit}
</style>
</helmet>
<div class="zt" data-theme="{{theme}}" style="min-height: 100vh; display: flex; flex-wrap: wrap">

<aside class="side">
<div class="side-top">
<span class="word">ZuTalk</span>
<a class="icon-btn" href="Main.dc.html" aria-label="新录音"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></a>
</div>
<label class="search"><svg class="i s" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg><input type="search" placeholder="搜索录音" aria-label="搜索录音"></label>
<nav class="list" aria-label="录音">
<sc-for list="{{rows}}" as="r" hint-placeholder-count="8">
<sc-if value="{{r.day}}" hint-placeholder-val="{{false}}"><div class="day">{{r.name}}</div></sc-if>
<sc-if value="{{r.row}}" hint-placeholder-val="{{true}}">
<a class="row {{r.cls}}" href="Reader.dc.html">
<span class="row-t">{{r.title}}</span>
<span class="row-m"><span class="num">{{r.len}}</span><span>{{r.langs}}</span>
<sc-if value="{{r.out}}" hint-placeholder-val="{{false}}"><svg class="i s" viewBox="0 0 24 24" role="img" aria-label="已对外"><path d="M7 17 17 7M8 7h9v9"></path></svg></sc-if>
<sc-if value="{{r.draft}}" hint-placeholder-val="{{false}}"><span class="tag">现场稿</span></sc-if>
</span>
</a>
</sc-if>
</sc-for>
</nav>
<div class="side-foot">
<span class="avatar" aria-hidden="true">H</span>
<span class="me" style="font-family: var(--f-ui); font-weight: 500">@demo</span>
<a class="icon-btn" href="Settings.dc.html" aria-label="设置"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"></circle><path d="M12 2v3M12 19v3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M2 12h3M19 12h3M4.9 19.1 7 17M17 7l2.1-2.1"></path></svg></a>
</div>
</aside>

<main class="main">
<header class="top">
<span class="private"><svg class="i s" viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="11" width="14" height="9" rx="2"></rect><path d="M8 11V8a4 4 0 0 1 8 0v3"></path></svg>只在本机</span>
<span class="spacer"></span>
<span class="seg" role="tablist"><button class="seg-i {{textCls}}" role="tab" aria-selected="{{isText}}" onClick="{{showText}}">文字稿</button><button class="seg-i {{noteCls}}" role="tab" aria-selected="{{isNote}}" onClick="{{showNote}}">笔记</button></span>
<button class="icon-btn" aria-label="更多"><svg class="i fill" viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="1.6"></circle><circle cx="12" cy="12" r="1.6"></circle><circle cx="19" cy="12" r="1.6"></circle></svg></button>
</header>

<article class="doc">
<h1 class="title" style="margin: 0">读书会：《看不见的城市》第三夜</h1>
<div class="meta"><span>今天 19:32</span><span class="num">42:18</span><span>中文 · English · ไทย</span><span class="tag">音频</span></div>

<sc-if value="{{isText}}" hint-placeholder-val="{{true}}">
<div class="acts">
<button class="btn"><svg class="i s" viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="9" width="11" height="11" rx="2"></rect><path d="M5 15V6a2 2 0 0 1 2-2h9"></path></svg>复制</button>
<sc-for list="{{langs}}" as="p" hint-placeholder-count="3">
<button class="pill {{p.cls}}" aria-pressed="{{p.on}}" onClick="{{p.toggle}}">{{p.name}}</button>
</sc-for>
<span class="spacer"></span>
<button class="pill">导出<svg class="i s" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg></button></div>

<ol class="tl">
<sc-for list="{{lines}}" as="l" hint-placeholder-count="6">
<li>
<div class="who"><b>{{l.who}}</b><span class="num">{{l.t}}</span></div>
<div>
<sc-if value="{{l.show}}" hint-placeholder-val="{{true}}">
<p class="said" lang="{{l.lang}}">{{l.pre}}<span class="unclear">{{l.unc}}</span>{{l.post}}
<sc-if value="{{l.hand}}" hint-placeholder-val="{{false}}"><span class="tag" style="margin-left: 8px; vertical-align: 2px">已改</span><button class="pill quiet" style="height: 22px; margin-left: 4px; padding: 0 8px; font-size: 11.5px; vertical-align: 2px; color: var(--accent)"><svg class="i s" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>记进知识库</button></sc-if>
<sc-if value="{{l.unclear}}" hint-placeholder-val="{{false}}"><span class="tag warn" style="margin-left: 8px; vertical-align: 2px">听不清</span></sc-if>
</p>
</sc-if>
<sc-if value="{{l.edit}}" hint-placeholder-val="{{false}}">
<p class="editing" style="margin: 0">{{l.pre}}<span class="caret" style="background: var(--accent)"></span></p>
</sc-if>
<sc-if value="{{l.hasA}}" hint-placeholder-val="{{true}}"><p class="tr" lang="{{l.aLang}}">{{l.a}}</p></sc-if>
<sc-if value="{{l.hasB}}" hint-placeholder-val="{{false}}"><p class="tr" lang="{{l.bLang}}">{{l.b}}</p></sc-if>
<sc-if value="{{l.hasNote}}" hint-placeholder-val="{{false}}"><p class="note"><svg class="i s" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16v4M14 6l4 4"></path></svg>{{l.note}}</p></sc-if>
<sc-if value="{{l.mark}}" hint-placeholder-val="{{false}}"><p class="note" style="color: var(--ink3); font-weight: 400"><svg class="i s" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 21V4M5 4h11l-2 4 2 4H5"></path></svg>标记</p></sc-if>
</div>
</li>
</sc-for>
</ol>
</sc-if>

<sc-if value="{{isNote}}" hint-placeholder-val="{{false}}">
<textarea aria-label="笔记" style="display: block; width: 100%; min-height: 360px; margin-top: 24px; padding: 0; border: 0; background: none; outline: 0; resize: none; font: 400 17px/1.9 var(--f-read); color: var(--ink)">1:05 留到最后一夜再谈
1:38

下次从第九章读起。
轮流朗读的办法不错，下次开场就这样。</textarea>
</sc-if>
</article>
</main>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
  state = { on: { zh: true, en: true, th: false }, tab: 'text' };
  renderVals() {
    const NAMES = { zh: '中文', en: 'English', th: 'ไทย' };
    const TAG = { zh: 'zh-Hans', en: 'en', th: 'th' };
    const on = this.state.on;
    const L = [
      { who: '主持人', t: '0:12', lang: 'zh', text: { zh: '我们从第三章开始。上次停在那座只存在于记忆里的城。', en: "Let's start from chapter three. Last time we stopped at the city that exists only in memory.", th: 'เราเริ่มจากบทที่สามกันนะ ครั้งก่อนเราหยุดที่เมืองซึ่งมีอยู่แค่ในความทรงจำ' } },
      { who: '说话人 2', t: '0:31', lang: 'en', text: { zh: '我觉得他写的每一座城，其实都是同一座。', en: 'I think every city he writes about is really the same one.', th: 'ฉันคิดว่าทุกเมืองที่เขาเขียนถึง จริง ๆ แล้วคือเมืองเดียวกัน' } },
      { who: '主持人', t: '0:44', lang: 'zh', hand: true, text: { zh: '对，所以读到后面，会觉得是在读一个人的回忆。', en: "Right, so later on it feels like reading one person's memories.", th: 'ใช่ พออ่านไปเรื่อย ๆ จะรู้สึกเหมือนอ่านความทรงจำของคนคนหนึ่ง' } },
      { who: '说话人 3', t: '1:05', lang: 'zh', note: '留到最后一夜再谈', unclear: ['我想问一下，书里的', '可汗', '到底相不相信他？'], text: { zh: '', en: 'May I ask: does the Khan in the book actually believe him?', th: 'ขอถามหน่อย ข่านในหนังสือเชื่อเขาจริงไหม' } },
      { who: '主持人', t: '1:20', lang: 'zh', edit: true, text: { zh: '这是个好问题。我们先把它记下来，读到第九章再回来看。', en: "That's a good question. Let's note it down and come back to it at chapter nine.", th: 'เป็นคำถามที่ดี จดไว้ก่อน แล้วค่อยกลับมาดูตอนอ่านถึงบทที่เก้า' } },
      { who: '说话人 2', t: '1:38', lang: 'en', mark: true, text: { zh: '我们能不能轮流把下一段念出来，一人一段？', en: 'Could we read the next passage aloud, one paragraph each?', th: 'เราผลัดกันอ่านย่อหน้าต่อไปออกเสียง คนละย่อหน้าได้ไหม' } },
    ];
    const lines = L.map((l) => {
      const tr = ['zh', 'en', 'th'].filter((x) => x !== l.lang && on[x]);
      const parts = l.unclear ?? [l.text[l.lang], '', ''];
      return {
        who: l.who, t: l.t, lang: TAG[l.lang], pre: parts[0], unc: parts[1], post: parts[2],
        hand: !!l.hand, unclear: !!l.unclear, edit: !!l.edit, show: !l.edit,
        hasNote: !!l.note, note: l.note ?? '', mark: !!l.mark,
        hasA: tr.length > 0, a: tr[0] ? l.text[tr[0]] : '', aLang: tr[0] ? TAG[tr[0]] : 'en',
        hasB: tr.length > 1, b: tr[1] ? l.text[tr[1]] : '', bLang: tr[1] ? TAG[tr[1]] : 'en',
      };
    });
    const day = (name) => ({ day: true, row: false, name });
    const row = (title, len, langs, flag) => ({ day: false, row: true, title, len, langs, out: flag === 'out', draft: flag === 'draft', cls: flag === 'on' ? 'on' : '' });
    const isText = this.state.tab === 'text';
    return {
      theme: this.props.theme ?? 'light',
      lines,
      langs: Object.keys(NAMES).map((x) => ({ name: NAMES[x], on: on[x], cls: on[x] ? 'on' : '', toggle: () => this.setState({ on: { ...on, [x]: !on[x] } }) })),
      isText, isNote: !isText, textCls: isText ? 'on' : '', noteCls: isText ? '' : 'on',
      showText: () => this.setState({ tab: 'text' }), showNote: () => this.setState({ tab: 'note' }),
      rows: [
        day('今天'),
        row('读书会：《看不见的城市》第三夜', '42:18', '中文 · English · ไทย', 'on'),
        row('和房东谈续租', '18:05', '中文 · ไทย'),
        day('昨天'),
        row('周会', '55:40', '中文'),
        row('泰语课 第 6 节', '1:02:11', 'ไทย · 中文', 'draft'),
        day('本周'),
        row('周三分享会：社区厨房', '1:34:02', '中文 · English', 'out'),
        row('访谈 · 木工坊', '47:26', 'English'),
        row('采购清单口述', '3:12', '中文'),
      ],
    };
  }
}
</script>
</body>
</html>
