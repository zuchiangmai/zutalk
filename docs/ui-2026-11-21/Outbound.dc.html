<!doctype html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<title>设置 · 对外</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/ds4seasdesignsystem_af6e46/colors_and_type.css">
<link rel="stylesheet" href="./zt.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Oxanium:wght@500;600;700&family=LXGW+WenKai+TC:wght@400;700&display=swap">
<style>
body{margin:0}
a{color:inherit}a:hover{color:inherit}
</style>
</helmet>
<div class="zt" data-theme="{{theme}}" style="min-height: 100vh; display: flex; flex-wrap: wrap">

<aside class="side">
<div class="side-top">
<span class="word">ZuTalk</span>
<a class="icon-btn" href="Main.dc.html" aria-label="新录音"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></a>
</div>
<label class="search"><svg class="i s" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg><input type="search" placeholder="搜索录音" aria-label="搜索录音"></label>
<nav class="list" aria-label="录音">
<sc-for list="{{rows}}" as="r" hint-placeholder-count="8">
<sc-if value="{{r.day}}" hint-placeholder-val="{{false}}"><div class="day">{{r.name}}</div></sc-if>
<sc-if value="{{r.row}}" hint-placeholder-val="{{true}}">
<a class="row" href="Reader.dc.html">
<span class="row-t">{{r.title}}</span>
<span class="row-m"><span class="num">{{r.len}}</span><span>{{r.langs}}</span>
<sc-if value="{{r.out}}" hint-placeholder-val="{{false}}"><svg class="i s" viewBox="0 0 24 24" role="img" aria-label="已对外"><path d="M7 17 17 7M8 7h9v9"></path></svg></sc-if>
<sc-if value="{{r.draft}}" hint-placeholder-val="{{false}}"><span class="tag">现场稿</span></sc-if>
</span>
</a>
</sc-if>
</sc-for>
</nav>
<div class="side-foot">
<span class="avatar" aria-hidden="true">H</span>
<span class="me" style="font-family: var(--f-ui); font-weight: 500">@demo</span>
<a class="icon-btn" href="Settings.dc.html" aria-label="设置" style="background: var(--soft2); color: var(--accent)"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"></circle><path d="M12 2v3M12 19v3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M2 12h3M19 12h3M4.9 19.1 7 17M17 7l2.1-2.1"></path></svg></a>
</div>
</aside>

<main class="main">
<header class="top">
<a class="pill quiet" href="Settings.dc.html"><svg class="i s" viewBox="0 0 24 24" aria-hidden="true"><path d="m15 6-6 6 6 6"></path></svg>设置</a>
</header>

<div class="page">
<h1 class="page-t">对外</h1>

<section class="group">
<h2 class="h">现场字幕</h2>
<div class="line"><span class="dot"></span><span>现在没有在对外</span></div>
</section>

<section class="group">
<h2 class="h">档案馆</h2>
<sc-for list="{{filings}}" as="f" hint-placeholder-count="3">
<div class="line">
<span class="read grow" style="font-size: 15px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">{{f.title}}</span>
<span class="k">{{f.event}}</span>
<sc-if value="{{f.filed}}" hint-placeholder-val="{{true}}"><span class="tag out"><svg class="i s" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 17 17 7M8 7h9v9"></path></svg>已交</span><span class="tag">{{f.what}}</span></sc-if>
<sc-if value="{{f.going}}" hint-placeholder-val="{{false}}"><span class="bar" style="width: 56px"><i style="width: 33%"></i></span><span class="shimmer" style="font-size: 12px">正在交全程录音</span></sc-if>
<sc-if value="{{f.failed}}" hint-placeholder-val="{{false}}"><span class="tag warn">未发送</span></sc-if>
</div>
</sc-for>
</section>
</div>
</main>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
  renderVals() {
    const day = (name) => ({ day: true, row: false, name });
    const row = (title, len, langs, flag) => ({ day: false, row: true, title, len, langs, out: flag === 'out', draft: flag === 'draft' });
    const filing = (title, event, state, what) => ({ title, event, what, filed: state === 'filed', going: state === 'going', failed: state === 'failed' });
    return {
      theme: this.props.theme ?? 'light',
      filings: [
        filing('开放麦：下个月的城', '清迈 · 今天', 'going'),
        filing('周三分享会：社区厨房', '清迈 · 周三', 'filed', '转写稿 · 全程录音'),
        filing('泰语角', '清迈 · 周一', 'filed', '只有转写稿'),
        filing('开放麦：十月回顾', '清迈 · 10 月 28 日', 'failed'),
      ],
      rows: [
        day('今天'),
        row('开放麦：下个月的城', '1:12:40', '中文 · English · ไทย', 'out'),
        row('读书会：《看不见的城市》第三夜', '42:18', '中文 · English · ไทย'),
        row('和房东谈续租', '18:05', '中文 · ไทย'),
        day('昨天'),
        row('周会', '55:40', '中文'),
        row('泰语课 第 6 节', '1:02:11', 'ไทย · 中文', 'draft'),
        day('本周'),
        row('周三分享会：社区厨房', '1:34:02', '中文 · English', 'out'),
        row('访谈 · 木工坊', '47:26', 'English'),
      ],
    };
  }
}
</script>
</body>
</html>
