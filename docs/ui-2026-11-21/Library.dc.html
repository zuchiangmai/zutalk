<!doctype html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<title>全部录音 · 录音很多时</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/ds4seasdesignsystem_af6e46/colors_and_type.css">
<link rel="stylesheet" href="./zt.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Oxanium:wght@500;600;700&family=LXGW+WenKai+TC:wght@400;700&display=swap">
<style>
body{margin:0}
a{color:inherit}a:hover{color:inherit}
</style>
</helmet>
<div class="zt" data-theme="{{theme}}" style="min-height: 100vh; display: flex; flex-wrap: wrap">

<aside class="side">
<div class="side-top">
<span class="word">ZuTalk</span>
<a class="icon-btn" href="Main.dc.html" aria-label="新录音"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></a>
</div>
<label class="search"><svg class="i s" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg><input type="search" placeholder="搜索录音" aria-label="搜索录音"><span class="kbd">⌘K</span></label>
<nav class="list" aria-label="录音">
<sc-for list="{{rows}}" as="r" hint-placeholder-count="8">
<sc-if value="{{r.day}}" hint-placeholder-val="{{false}}"><div class="day">{{r.name}}</div></sc-if>
<sc-if value="{{r.row}}" hint-placeholder-val="{{true}}">
<a class="row" href="Reader.dc.html">
<span class="row-t">{{r.title}}</span>
<span class="row-m"><span class="num">{{r.len}}</span><span>{{r.langs}}</span>
<sc-if value="{{r.out}}" hint-placeholder-val="{{false}}"><svg class="i s" viewBox="0 0 24 24" role="img" aria-label="已对外"><path d="M7 17 17 7M8 7h9v9"></path></svg></sc-if>
<sc-if value="{{r.draft}}" hint-placeholder-val="{{false}}"><span class="tag">现场稿</span></sc-if>
</span>
</a>
</sc-if>
</sc-for>
<div class="day">更早</div>
<a class="fold" href="Library.dc.html"><svg class="i s" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 6 6 6-6 6"></path></svg>11 月<span class="n">14</span></a>
<a class="fold" href="Library.dc.html"><svg class="i s" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 6 6 6-6 6"></path></svg>10 月<span class="n">23</span></a>
<a class="fold" href="Library.dc.html"><svg class="i s" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 6 6 6-6 6"></path></svg>9 月<span class="n">31</span></a>
<a class="fold on" href="Library.dc.html" style="margin-top: 8px"><svg class="i s" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="2"></rect><path d="M4 10h16M10 4v16"></path></svg>全部录音<span class="n">175</span></a>
</nav>
<div class="side-foot">
<span class="avatar" aria-hidden="true">H</span>
<span class="me" style="font-family: var(--f-ui); font-weight: 500">@demo</span>
<a class="icon-btn" href="Settings.dc.html" aria-label="设置"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"></circle><path d="M12 2v3M12 19v3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M2 12h3M19 12h3M4.9 19.1 7 17M17 7l2.1-2.1"></path></svg></a>
</div>
</aside>

<main class="main">
<header class="top" style="padding: 0 28px; gap: 10px">
<h1 class="read" style="margin: 0; font-size: 22px; font-weight: 700">全部录音</h1>
<span class="num" style="font-size: 14px; color: var(--ink3)">175</span>
</header>

<div style="display: flex; flex-direction: column; gap: 12px; padding: 2px 28px 0">
<label class="search" style="height: 40px; margin: 0"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg><input type="search" placeholder="搜索说过的话、标题、话题" aria-label="搜索说过的话、标题、话题" onChange="{{onQuery}}" style="font-size: 14px"><span class="kbd">⌘K</span></label>
<div class="set-v">
<sc-for list="{{filters}}" as="f" hint-placeholder-count="6">
<button class="pill {{f.cls}}" aria-pressed="{{f.on}}" onClick="{{f.toggle}}">{{f.name}}</button>
</sc-for>
</div>
</div>

<div class="lib">
<div class="rail">
<div class="day" style="padding-top: 16px">2026</div>
<sc-for list="{{months}}" as="m" hint-placeholder-count="8">
<button class="month {{m.cls}}" onClick="{{m.pick}}">{{m.name}}<span class="n">{{m.n}}</span></button>
</sc-for>
<div class="heat" role="img" aria-label="这个月哪几天有录音">
<sc-for list="{{heat}}" as="c" hint-placeholder-count="42"><i class="{{c.cls}}"></i></sc-for>
</div>
</div>

<div class="days">
<sc-for list="{{items}}" as="x" hint-placeholder-count="12">
<sc-if value="{{x.day}}" hint-placeholder-val="{{false}}"><div class="dayh">{{x.name}}</div></sc-if>
<sc-if value="{{x.row}}" hint-placeholder-val="{{true}}">
<a class="lrow" href="Reader.dc.html">
<span class="num">{{x.time}}</span>
<span style="display: flex; flex-direction: column; min-width: 0"><span class="lrow-t">{{x.title}}</span><span class="lrow-s">{{x.topics}}</span></span>
<span class="k">{{x.langs}}</span>
<span class="num" style="text-align: right">{{x.len}}</span>
<span style="display: grid; place-items: center"><sc-if value="{{x.out}}" hint-placeholder-val="{{false}}"><svg class="i s" viewBox="0 0 24 24" role="img" aria-label="已对外"><path d="M7 17 17 7M8 7h9v9"></path></svg></sc-if></span>
</a>
</sc-if>
</sc-for>
<sc-if value="{{none}}" hint-placeholder-val="{{false}}"><p class="read" style="margin: 48px 0; font-size: 17px; color: var(--ink3)">没有匹配的录音</p></sc-if>
</div>
</div>
</main>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
  // Two ways to find a recording among many: when it was (months, then days) and what was
  // said (search over titles, topics and text). Filters are the facts a row already carries.
  state = { q: '', on: {}, month: 0 };
  renderVals() {
    const { q, on, month } = this.state;
    const day = (name) => ({ day: true, row: false, name });
    const row = (title, len, langs, flag) => ({ day: false, row: true, title, len, langs, out: flag === 'out', draft: flag === 'draft' });
    const R = [
      ['20 日 · 周五', '19:32', '读书会：《看不见的城市》第三夜', '记忆里的城 · 可汗信不信 · 轮流朗读', '中 · EN · ไทย', '42:18', ['zh', 'en', 'th', 'audio']],
      ['20 日 · 周五', '15:10', '和房东谈续租', '续一年 · 押金', '中 · ไทย', '18:05', ['zh', 'th', 'audio']],
      ['19 日 · 周四', '16:30', '泰语课 第 6 节', '量词 · 点菜', 'ไทย · 中', '1:02:11', ['th', 'zh', 'draft', 'audio']],
      ['19 日 · 周四', '10:00', '周会', '排班 · 采购 · 下周的活动', '中', '55:40', ['zh']],
      ['18 日 · 周三', '21:00', '周三分享会：社区厨房', '排班表 · 食材预算', '中 · EN', '1:34:02', ['zh', 'en', 'out', 'audio']],
      ['17 日 · 周二', '14:20', '访谈 · 木工坊', '学徒 · 借工具', 'EN', '47:26', ['en', 'audio']],
      ['17 日 · 周二', '09:05', '采购清单口述', '', '中', '3:12', ['zh']],
      ['14 日 · 周六', '19:30', '开放麦：十一月', '厨房 · 图书馆 · 新来的人', '中 · EN · ไทย', '1:21:09', ['zh', 'en', 'th', 'out']],
      ['12 日 · 周四', '16:30', '泰语课 第 5 节', '声调 · 问路', 'ไทย · 中', '58:20', ['th', 'zh']],
      ['10 日 · 周二', '11:00', '木工坊安全说明', '电锯 · 护目镜', 'EN · 中', '24:47', ['en', 'zh', 'draft']],
    ];
    const F = [['out', '已交'], ['draft', '现场稿'], ['audio', '有音频'], ['zh', '中文'], ['en', 'English'], ['th', 'ไทย']];
    const wanted = F.filter(([k]) => on[k]).map(([k]) => k);
    const hit = R.filter((r) => wanted.every((k) => r[6].includes(k)) && (!q || (r[2] + r[3]).toLowerCase().includes(q.toLowerCase())));
    const items = [];
    hit.forEach((r, i) => {
      if (i === 0 || hit[i - 1][0] !== r[0]) items.push({ day: true, row: false, name: '11 月 ' + r[0] });
      items.push({ day: false, row: true, time: r[1], title: r[2], topics: r[3], langs: r[4], len: r[5], out: r[6].includes('out') });
    });
    const M = [['11 月', 21], ['10 月', 23], ['9 月', 31], ['8 月', 28], ['7 月', 19], ['6 月', 22], ['5 月', 17], ['更早', 14]];
    // November 2026 begins on a Sunday; weeks start on Monday.
    const perDay = { 1: 2, 2: 1, 3: 2, 5: 3, 6: 1, 7: 2, 10: 1, 12: 1, 14: 1, 17: 2, 18: 1, 19: 2, 20: 2 };
    const heat = [];
    for (let i = 0; i < 6; i++) heat.push({ cls: 'pad' });
    for (let d = 1; d <= 30; d++) heat.push({ cls: ['', 'a', 'b', 'c'][Math.min(3, perDay[d] ?? 0)] });
    return {
      theme: this.props.theme ?? 'light',
      onQuery: (e) => this.setState({ q: e.target.value }),
      filters: F.map(([k, name]) => ({ name, on: !!on[k], cls: on[k] ? 'on' : '', toggle: () => this.setState({ on: { ...on, [k]: !on[k] } }) })),
      months: M.map(([name, n], i) => ({ name, n, cls: i === month ? 'on' : '', pick: () => this.setState({ month: i }) })),
      heat, items, none: items.length === 0,
      rows: [
        day('今天'),
        row('读书会：《看不见的城市》第三夜', '42:18', '中文 · English · ไทย'),
        row('和房东谈续租', '18:05', '中文 · ไทย'),
        day('昨天'),
        row('泰语课 第 6 节', '1:02:11', 'ไทย · 中文', 'draft'),
        row('周会', '55:40', '中文'),
        day('本周'),
        row('周三分享会：社区厨房', '1:34:02', '中文 · English', 'out'),
        row('访谈 · 木工坊', '47:26', 'English'),
      ],
    };
  }
}
</script>
</body>
</html>
