<!doctype html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<title>新建身份 · 存好恢复密钥</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/ds4seasdesignsystem_af6e46/colors_and_type.css">
<link rel="stylesheet" href="./zt.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Oxanium:wght@500;600;700&family=LXGW+WenKai+TC:wght@400;700&display=swap">
<style>
body{margin:0}
a{color:inherit}a:hover{color:inherit}
</style>
</helmet>
<div class="zt" data-theme="{{theme}}" style="min-height: 100vh; display: flex; flex-wrap: wrap">

<aside class="side">
<div class="side-top"><span class="word">ZuTalk</span></div>
<label class="search"><svg class="i s" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg><input type="search" placeholder="搜索录音" aria-label="搜索录音"></label>
<nav class="list" aria-label="录音"><p class="read" style="margin: 28px 10px; font-size: 15px; color: var(--ink3)">还没有录音</p></nav>
<div class="side-foot">
<span class="avatar" aria-hidden="true">Z</span>
<span class="me">did:zu:7kq2…f9a</span>
<a class="icon-btn" href="Settings.dc.html" aria-label="设置"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"></circle><path d="M12 2v3M12 19v3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M2 12h3M19 12h3M4.9 19.1 7 17M17 7l2.1-2.1"></path></svg></a>
</div>
</aside>

<main class="main">
<header class="top">
<span class="private"><svg class="i s" viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="11" width="14" height="9" rx="2"></rect><path d="M8 11V8a4 4 0 0 1 8 0v3"></path></svg>只在本机</span>
</header>
<section class="stage">
<span class="rec" aria-hidden="true"><svg class="i" viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"></rect><path d="M5 11a7 7 0 0 0 14 0M12 18v3"></path></svg></span>
<div class="stage-t">开始录音</div>
</section>
</main>

<div class="scrim">
<div class="dialog" role="dialog" aria-labelledby="rk-t" aria-describedby="rk-d">
<h2 id="rk-t" class="dialog-t">新建身份</h2>
<p id="rk-d" class="dialog-d">别人可以用句柄找到你。</p>

<label class="label" for="rk-handle" style="margin-top: 20px">句柄</label>
<div class="field" style="display: flex; align-items: center; gap: 2px; width: 100%; padding: 0 12px">
<span style="color: var(--ink3)">@</span>
<input id="rk-handle" placeholder="例如 lin" autocomplete="off" style="flex: 1; min-width: 0; height: 32px; border: 0; background: none; outline: 0; font: inherit; color: inherit">
</div>
<p class="k" style="margin: 6px 0 0">2 到 32 位：小写字母、数字、-</p>

<label class="label" style="margin-top: 20px">恢复密钥</label>
<div style="display: flex; gap: 8px">
<span class="field mono" style="flex: 1; display: flex; align-items: center; letter-spacing: .22em; overflow: hidden" role="img" aria-label="恢复密钥，没有显示">••••••••••••••••••••••••</span>
<button class="pill" style="height: 34px">复制</button>
</div>
<p class="k" style="margin: 6px 0 0">存进你的密码管理器。这台设备丢了，凭它能取回你的身份。</p>

<div class="dialog-a">
<a class="btn ghost" href="Ask.dc.html">返回</a>
<a class="btn" href="Main.dc.html">新建身份</a>
</div>
</div>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
  // A new identity is made on this device. Its recovery key goes from the core to the clipboard
  // and is never drawn on the page. "以后" does not block: the reminder stays in the settings.
  // Until the person takes a name in the city, the identity is shown by its number.
  renderVals() { return { theme: this.props.theme ?? 'light' }; }
}
</script>
</body>
</html>
