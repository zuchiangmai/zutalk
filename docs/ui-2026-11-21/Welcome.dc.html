<!doctype html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<title>第一次打开 · 登录</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/ds4seasdesignsystem_af6e46/colors_and_type.css">
<link rel="stylesheet" href="./zt.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Oxanium:wght@500;600;700&family=LXGW+WenKai+TC:wght@400;700&display=swap">
<style>
body{margin:0}
a{color:inherit}a:hover{color:inherit}
</style>
</helmet>
<div class="zt" data-theme="{{theme}}" style="min-height: 100vh; display: flex; flex-wrap: wrap">

<section style="flex: 1 1 440px; min-height: 380px; display: flex; flex-direction: column; justify-content: space-between; gap: 40px; padding: 48px 56px; background: #006A47; color: #D8FAE8">
<span style="font: 600 20px/1 var(--f-num); letter-spacing: .02em; color: #8EF2C4">ZuTalk</span>
<h1 class="read" style="margin: 0; max-width: 10em; font-size: 46px; line-height: 1.4; font-weight: 700; color: #fff; text-wrap: balance">把一场对话，变成你自己签名的文字。</h1>
<div style="display: flex; flex-wrap: wrap; gap: 8px">
<span style="display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 12px; border-radius: 999px; background: rgba(255,255,255,.14); color: #fff; font-weight: 500"><svg class="i s" viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="11" width="14" height="9" rx="2"></rect><path d="M8 11V8a4 4 0 0 1 8 0v3"></path></svg>录音只在本机</span>
<span style="display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 12px; border-radius: 999px; background: rgba(255,255,255,.14); color: #fff; font-weight: 500"><svg class="i s" viewBox="0 0 24 24" aria-hidden="true"><path d="m5 12 5 5 9-10"></path></svg>文字由你签名</span>
<span style="display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 12px; border-radius: 999px; background: rgba(255,255,255,.14); color: #fff; font-weight: 500"><svg class="i s" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 17 17 7M8 7h9v9"></path></svg>对外每次都问</span>
</div>
</section>

<section style="flex: 1 1 440px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px; padding: 48px 32px; background: var(--paper)">
<button class="pill"><svg class="i s" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"></path></svg>清迈<svg class="i s" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg></button>
<div class="qr" style="padding: 18px; border-radius: 24px; box-shadow: var(--shadow)"><svg viewBox="0 0 25 25" width="208" height="208" role="img" aria-label="登录码" shape-rendering="crispEdges"><path d="{{qr}}" fill="#0A0A0A"></path></svg></div>
<p class="read" style="margin: 0; font-size: 17px; color: var(--ink2); text-align: center">用存着你 Zu 身份的设备扫码</p><div style="display: flex; align-items: center; gap: 10px" role="status">
<span class="dot" style="background: var(--accent); animation: zt-pulse 2s ease-in-out infinite"></span>
<span class="shimmer" style="font-size: 13px">等待扫码</span>
<span class="k num">4:52</span>
</div>
<div style="display: flex; flex-wrap: wrap; justify-content: center; gap: 8px">
<button class="pill">复制登录码</button>
<button class="pill quiet">换一个码</button>
</div>
</section>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
  renderVals() {
    // A stand-in pattern, not a code that scans.
    const qr = (seed) => {
      const n = 25; let s = seed, d = '';
      const rnd = () => (s = (s * 1103515245 + 12345) & 0x7fffffff) / 0x7fffffff;
      const corner = (x, y) => (x < 8 && y < 8) || (x > n - 9 && y < 8) || (x < 8 && y > n - 9);
      for (let y = 0; y < n; y++) for (let x = 0; x < n; x++) {
        let on;
        if (corner(x, y)) {
          const fx = x < 8 ? x : x - (n - 7), fy = y < 8 ? y : y - (n - 7);
          on = fx >= 0 && fx <= 6 && fy >= 0 && fy <= 6 && (fx === 0 || fx === 6 || fy === 0 || fy === 6 || (fx >= 2 && fx <= 4 && fy >= 2 && fy <= 4));
        } else on = rnd() > 0.52;
        if (on) d += 'M' + x + ' ' + y + 'h1v1h-1z';
      }
      return d;
    };
    return { theme: this.props.theme ?? 'light', qr: qr(424242) };
  }
}
</script>
</body>
</html>
