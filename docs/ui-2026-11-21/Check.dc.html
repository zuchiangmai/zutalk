<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
  // The same six digits are shown on both devices (pol V0.3 derives them from the two public
  // keys); the person compares them before the key is kept. The identity is named by its
  // handle in the city when it has one, with its number beside it.
  renderVals() { return { theme: this.props.theme ?? 'light' }; }
}
