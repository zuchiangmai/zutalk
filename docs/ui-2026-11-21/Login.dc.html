</div>
</aside>

<main class="main">
<header class="top">
<span class="private"><svg class="i s" viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="11" width="14" height="9" rx="2"></rect><path d="M8 11V8a4 4 0 0 1 8 0v3"></path></svg>只在本机</span>

<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 22px; margin-top: 20px">
<a class="qr" href="Check.dc.html" style="padding: 14px; border-radius: 18px"><svg viewBox="0 0 25 25" width="168" height="168" role="img" aria-label="登录码" shape-rendering="crispEdges"><path d="{{qr}}" fill="#0A0A0A"></path></svg></a>
<ol style="flex: 1; min-width: 200px; margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 14px; font-size: 14px; line-height: 1.5">
<li style="display: flex; gap: 10px"><span class="avatar" aria-hidden="true" style="width: 22px; height: 22px; background: var(--soft2); color: var(--accent)">1</span><span>在已登录的设备上打开你的城</span></li>
<li style="display: flex; gap: 10px"><span class="avatar" aria-hidden="true" style="width: 22px; height: 22px; background: var(--soft2); color: var(--accent)">2</span><span>点头像，再点「连接新设备」；或者用手机相机</span></li>
<li style="display: flex; gap: 10px"><span class="avatar" aria-hidden="true" style="width: 22px; height: 22px; background: var(--soft2); color: var(--accent)">3</span><span>扫描此二维码</span></li>

<div class="dialog-a" style="justify-content: space-between">
<button class="btn ghost">使用恢复密钥登录</button>
<button class="btn ghost">复制链接</button>
</div>
<a class="icon-btn dialog-x" href="Main.dc.html" aria-label="关闭"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"></path></svg></a>
</div>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
  // As in pol V0.3: the device that wants the identity shows the code and the device that holds
  // it scans. The code is a one-time key and a room on the relay; it lasts five minutes. No
  // city is chosen here. A stand-in pattern is drawn in place of the code.
  renderVals() {
    const qr = (seed) => {
      const n = 25; let s = seed, d = '';
      const rnd = () => (s = (s * 1103515245 + 12345) & 0x7fffffff) / 0x7fffffff;
      const corner = (x, y) => (x < 8 && y < 8) || (x > n - 9 && y < 8) || (x < 8 && y > n - 9);
      for (let y = 0; y < n; y++) for (let x = 0; x < n; x++) {
        let on;
        if (corner(x, y)) {
          const fx = x < 8 ? x : x - (n - 7), fy = y < 8 ? y : y - (n - 7);
          on = fx >= 0 && fx <= 6 && fy >= 0 && fy <= 6 && (fx === 0 || fx === 6 || fy === 0 || fy === 6 || (fx >= 2 && fx <= 4 && fy >= 2 && fy <= 4));
        } else on = rnd() > 0.52;
        if (on) d += 'M' + x + ' ' + y + 'h1v1h-1z';
      }
      return d;
    };
    return { theme: this.props.theme ?? 'light', qr: qr(424242) };
  }
}
</script>
</body>
</html>
