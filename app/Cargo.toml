[package]
name = "zutalk"
description = "The desktop shell: windows, the bridge between the interface and the core, and updates."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
# The context `generate_context!` writes reads the plugins' config through it.
serde_json = "1.0.154"
tauri = { version = "2.12.5", features = ["macos-private-api"] }
tauri-plugin-clipboard-manager = "2.5.0"
tauri-plugin-dialog = "2.8.4"
# Without its system proxy, which would reach the core's own requests through the shared reqwest.
tauri-plugin-updater = { version = "=2.13.2", default-features = false, features = ["rustls-tls"] }
tokio = { version = "1.54.1", features = ["macros", "sync", "time"] }
zutalk-core = { path = "../core" }
zutalk-log = { path = "../log" }

[dev-dependencies]
base64 = "0.23.1"
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["rt", "test-util"] }

[build-dependencies]
tauri-build = "2.7.4"
