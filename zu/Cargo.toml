[package]
name = "zu"
description = "The Zu protocol kernel: data model, records, keys, storage. Shared by every Zu application."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
aes-gcm = { version = "0.11", default-features = false, features = ["aes", "alloc", "zeroize"] }
ed25519-dalek = { version = "3", features = ["zeroize"] }
ipld-core = "0.4"
k256 = { version = "0.14", default-features = false, features = ["ecdsa"] }
multibase = "0.9"
p256 = { version = "0.14.0", default-features = false, features = ["ecdsa", "ecdh"] }
serde_ipld_dagcbor = "0.7"
serde_json = "1"
sha2 = "0.11"
zeroize = "1"

[dev-dependencies]
curve25519-dalek = "5"
proptest = "1"
tempfile = "3"
