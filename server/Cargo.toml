[package]
name = "zutalk-server"
description = "Short-lived keys from granted quota, and rooms of ciphertext. It never sees a word."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio", "query"] }
base64 = "0.23.1"
getrandom = { version = "0.4.3", features = ["std"] }
humantime = "2.4.0"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider", "json"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "sync", "time", "net"] }
tokio-stream = { version = "0.1.19", features = ["sync"] }
zu = { version = "0.9.0", path = "../zu" }

[dev-dependencies]
aes-gcm = "0.11.1"
http-body-util = "0.1.5"
tempfile = "3.27.0"
tower = { version = "0.5.3", features = ["util"] }
